services:
  - type: web
    name: nexlayer-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FRONTEND_ORIGINS
        value: https://nexlayer-woad.vercel.app,http://localhost:5173
      - key: NOTIFY_EMAIL
        value: renzogutierrez966111@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Nexlayer <onboarding@resend.dev>
